<!DOCTYPE html>
<html>
<head>
    <title>Iframe Demo Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            display: grid;
            grid-template-columns: 30% 70%;
            height: 100vh;
        }
        .left {
            background-color: #f0f0f0;
            padding: 10px;
        }
        .right {
            display: grid;
            grid-template-rows: 50% 50%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        h2 {
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    
    <!-- Left Frame (Navigation / External Page) -->
    <div class="left">
        <h2>External Website</h2>
        <iframe src="https://www.wikipedia.org"></iframe>
    </div>

    <!-- Right Frame (Top: Map, Bottom: Another Page) -->
    <div class="right">
        
        <!-- Google Map -->
        <iframe 
            src="https://www.google.com/maps?q=Nagpur&output=embed">
        </iframe>

        <!-- Another External Page -->
        <iframe src="https://www.example.com"></iframe>

    </div>

</div>

</body>
</html>
